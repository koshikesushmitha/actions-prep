name: View CSR Contents

on:
  workflow_dispatch:
    inputs:
      csr:
        description: "CSR PEM (can be single-line)"
        required: true
        type: string

jobs:
  view-csr:
    runs-on: ubuntu-latest
    steps:
      - name: Check OpenSSL version
        run: openssl version
      - name: View contents
        shell: bash
        run: |
         CSR_FILE="contents/request.csr"
         openssl req -in CSR_FILE -noout -text
          

