name: View CSR Contents

on:
  workflow_dispatch:
    inputs:
      csr:
        description: "CSR PEM (can be single-line)"
        required: true
        type: string

jobs:
  view-csr:
    runs-on: ubuntu-latest
    steps:
      - name: Write PEM CSR to file
        run: |
          cat << 'EOF' > request.csr
          ${{ github.event.inputs.csr }}
          EOF
          openssl req -in request.csr -noout -text


      - name: View CSR
        run: |
          openssl req -in request.csr -noout -text

