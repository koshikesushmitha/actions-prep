name: View CSR Contents

on:
  workflow_dispatch:
    inputs:
      csr:
        description: "CSR PEM (can be single-line)"
        required: true
        type: string

jobs:
  view-csr:
    runs-on: ubuntu-latest
    steps:
      - name: Write PEM CSR to file
        run: |
          cat << 'EOF' > request.csr
          ${{ github.event.inputs.csr }}
          EOF
      - name: View contents
        run: |
          first_line=$(head -1 request.csr)
          if [[ "$first_line" == "-----BEGIN CERTIFICATE REQUEST-----" ]]; then
            openssl req -in request.csr -noout -text
          elif [[ "$first_line" == "-----BEGIN CERTIFICATE-----" ]]; then
            openssl x509 -in request.csr -noout -text
          else
            echo "Unknown PEM type"
            exit 1
          fi

