name: View CSR

on:
  workflow_dispatch:
    inputs:
      csr:
        description: "Paste your CSR PEM here"
        required: true

jobs:
  view-csr:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Write the raw CSR input to a file
      - name: Write CSR to file
        run: |
          # cat << 'EOF' > request.csr
          # ${{ github.event.inputs.csr }}
          # EOF

      # Step 2: Display CSR contents
      - name: Decode CSR from base64
        run: |
          newcsr = base64 -w0 ${{ github.event.inputs.csr }}
          echo "$newcsr" | base64 -d > request.csr
          openssl req -in request.csr -noout -text

