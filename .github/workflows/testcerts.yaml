name: View CSR

on:
  workflow_dispatch:   # You can manually trigger this workflow

jobs:
  view-csr:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # Step 2: Check if the CSR file exists
      - name: Verify CSR file exists
        run: |
          CSR_FILE="contents/request.csr"  # Path to your CSR in the repo
          if [ ! -f "$CSR_FILE" ]; then
            echo "CSR file not found at $CSR_FILE!"
            exit 1
          fi
          echo "CSR file found: $CSR_FILE"

      # Step 3: View the CSR contents
      - name: Display CSR contents
        run: |
          CSR_FILE="contents/request.csr"
          echo "Displaying contents of $CSR_FILE..."
          openssl req -in "$CSR_FILE" -noout -text
