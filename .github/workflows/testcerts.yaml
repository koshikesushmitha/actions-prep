name: View CSR Contents

on:
  workflow_dispatch:
    inputs:
      csr:
        description: "CSR PEM (can be single-line)"
        required: true
        type: string

jobs:
  view-csr:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct CSR formatting
        run: |
          echo "${{ inputs.csr }}" \
          | sed 's/-----BEGIN CERTIFICATE REQUEST-----/-----BEGIN CERTIFICATE REQUEST-----\n/' \
          | sed 's/-----END CERTIFICATE REQUEST-----/\n-----END CERTIFICATE REQUEST-----/' \
          | tr ' ' '\n' \
          > request.csr

          openssl req -in request.csr -noout -text


      - name: Debug CSR file
        run: |
          cat -n request.csr

      - name: View CSR
        run: |
          openssl req -in request.csr -noout -text
