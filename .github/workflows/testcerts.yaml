name: View CSR

on:
  workflow_dispatch:
    inputs:
      csr:
        description: "Paste your CSR PEM here (raw, including BEGIN/END lines)"
        required: true

jobs:
  view-csr:
    runs-on: ubuntu-latest
    steps:
      - name: Convert input CSR to base64 and decode safely
        shell: bash
        run: |
          # Read raw CSR input into a variable
          CSR_RAW="${{ github.event.inputs.csr }}"

          # Encode it to base64 (this ensures line breaks won't break OpenSSL)
          BASE64_CSR=$(echo "$CSR_RAW" | base64 -w0)

          echo "$BASE64_CSR"

          # Decode base64 into a file
          echo "$BASE64_CSR" | base64 -d > request.csr

          echo request.csr

          # View CSR contents
          openssl req -in request.csr -noout -text
